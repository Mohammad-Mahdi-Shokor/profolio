<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- Open Graph Meta Tags for WhatsApp/Social Media Previews -->
  <meta property="og:title" content="Your Page Title Here" />
  <meta property="og:description" content="Your page description here - make it compelling and under 200 characters" />
  <meta property="og:url" content="https://yourdomain.com" />
  <meta property="og:image" content="https://yourdomain.com/path/to/your-image.jpg" />
  <meta property="og:type" content="website" />
  
  <!-- Optional: Twitter Card tags (for better Twitter previews) -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Your Page Title Here" />
  <meta name="twitter:description" content="Your page description here" />
  <meta name="twitter:image" content="https://yourdomain.com/path/to/your-image.jpg" />

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="profolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>profolio</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="margin:0; background:#0a0a0a; color:white; font-family:sans-serif;">
  <div id="loader" style="
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
  ">
    Loading...
  </div>
<script>
  const params = new URLSearchParams(window.location.search);
  const target = params.get("url");

  if (target) {
    try {
      const parsed = new URL(target);

      if (parsed.protocol === "http:" || parsed.protocol === "https:") {
        window.location.replace(parsed.href);
      }
    } catch (e) {
      console.log("Invalid URL");
    }
  }
</script>
  <script src="flutter_bootstrap.js" async></script>

  <script>
    window.addEventListener('load', () => {
      const loader = document.getElementById('loader');
      if (loader) loader.remove();
    });
  </script>
</body>
</html>
